name: Update repository About

# Updates the GitHub repository "About" sidebar (description + topics) when a
# version tag is pushed, and can also be started manually. Editing repository
# settings via `gh repo edit` needs the default GITHUB_TOKEN to have write
# access, which requires "Read and write permissions" under Settings > Actions
# > General > Workflow permissions for this repository (there is no separate
# "administration" scope in the workflow-level permissions block below — repo
# settings aren't part of that fine-grained list). If that repo setting is
# left at "Read repository contents permission" (the default), this job will
# fail with 403 and the description must be set manually in Settings — the
# topics step can still be retried once write access is enabled.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - name: Set description and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh repo edit "$GITHUB_REPOSITORY" \
            --description "Biblioteca Python para obter, padronizar, analisar e exportar dados hidrológicos da ANA (tradução do pacote R hydroDataBR)." \
            --add-topic hydrology \
            --add-topic brazil \
            --add-topic ana \
            --add-topic hidroweb \
            --add-topic hydrological-data \
            --add-topic water-resources \
            --add-topic streamflow \
            --add-topic rainfall \
            --add-topic python \
            --add-topic pandas
